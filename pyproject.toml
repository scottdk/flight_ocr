[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-ocr"
version = "1.0.0"
description = "Extract price data from flight grid images using OCR"
authors = [
    {name = "Scott DK", email = "scott@example.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "pillow>=9.0.0",
    "pytesseract>=0.3.10",
    "numpy>=1.21.0",
]

[project.optional-dependencies]
analysis = [
    "pandas>=1.3.0",
    "matplotlib>=3.5.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pylint>=2.15.0",
    "black>=22.0.0",
    "isort>=5.10.0",
    "mypy>=0.991",
]
visualization = [
    "rich>=12.0.0",
]

[project.scripts]
flight-ocr = "flight_ocr.cli.main:main"

[project.urls]
Homepage = "https://github.com/scottdk/flight_ocr"
Repository = "https://github.com/scottdk/flight_ocr"
Issues = "https://github.com/scottdk/flight_ocr/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["flight_ocr*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=flight_ocr --cov-report=term-missing --cov-report=html"

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.pylint.messages_control]
disable = [
    "missing-docstring",
    "too-few-public-methods",
]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
